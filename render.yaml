services:
  - type: web
    name: agrisage
    env: python
    plan: free
    autoDeploy: false
    # CPU-only torch wheels first (the default PyPI wheel bundles CUDA and is
    # far too large for the build); requirements' torch==2.9.1 is then already
    # satisfied by 2.9.1+cpu and is not re-downloaded.
    buildCommand: pip install --upgrade pip && pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: gunicorn --chdir backend --workers 1 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_CHECKPOINT_PATH
        value: backend/models/weights/classification_model.pth
      - key: MODEL_CONFIG_PATH
        value: backend/models/config6.json
