name: P0 security

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-random-bytes
      # TEST_POSTGRES_DATABASE_URL is deliberately unset while the deployment
      # runs on disposable SQLite: backend/tests/test_postgres_p0.py skips
      # itself without it. Restore the postgres:16 service container and this
      # variable when switching back to persistent PostgreSQL.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            Flask==3.1.3 \
            gunicorn==26.0.0 \
            PyJWT==2.13.0 \
            SQLAlchemy==2.0.51 \
            alembic==1.18.5 \
            openai \
            python-dotenv==1.0.1 \
            numpy \
            ruff==0.12.0
      - name: Static checks
        run: |
          ruff format --check \
            backend/app.py \
            backend/auth.py \
            backend/ai/pipeline.py \
            backend/db \
            backend/tests
          ruff check \
            backend/app.py \
            backend/auth.py \
            backend/ai/pipeline.py \
            backend/db \
            backend/tests
          bash -n scripts/deploy-cloudrun.sh scripts/demo.sh scripts/setup.sh
      - name: Unit tests
        run: python -m unittest discover -s backend/tests -v
      - name: Production server import check
        env:
          # Mirror the deployed demo revision: Cloud Run + disposable SQLite.
          K_SERVICE: agrisage-ci
          ALLOW_EPHEMERAL_SQLITE: "true"
        run: >-
          gunicorn
          --check-config
          --chdir backend
          --workers 1
          --threads 4
          --timeout 120
          app:app
