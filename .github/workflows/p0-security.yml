name: P0 security and PostgreSQL

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agrisage_test
          POSTGRES_USER: agrisage
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrisage -d agrisage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-random-bytes
      TEST_POSTGRES_DATABASE_URL: postgresql://agrisage:integration-password@127.0.0.1:5432/agrisage_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            Flask==3.1.3 \
            gunicorn==26.0.0 \
            PyJWT==2.13.0 \
            SQLAlchemy==2.0.51 \
            alembic==1.18.5 \
            "psycopg[binary]==3.3.4" \
            openai \
            python-dotenv==1.0.1 \
            numpy \
            ruff
      - name: Static checks
        run: |
          ruff format --check \
            backend/app.py \
            backend/auth.py \
            backend/ai/pipeline.py \
            backend/db \
            backend/tests
          ruff check \
            backend/app.py \
            backend/auth.py \
            backend/ai/pipeline.py \
            backend/db \
            backend/tests
          bash -n scripts/deploy-cloudrun.sh scripts/demo.sh scripts/setup.sh
      - name: Unit and PostgreSQL integration tests
        run: python -m unittest discover -s backend/tests -v
      - name: Production server import check
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_DATABASE_URL }}
          K_SERVICE: agrisage-ci
        run: >-
          gunicorn
          --check-config
          --chdir backend
          --workers 1
          --threads 4
          --timeout 120
          app:app
